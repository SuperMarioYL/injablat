# Runtime defaults read by the CLI. Command-line options override them; claims
# never carry timeouts or run counts. Settings with no reader are rejected when
# the file loads, so every key here is actually consumed.

backend:
  # Per-request timeouts in seconds: chat completions, and the native endpoints
  # (/tokenize, /version, /props, /tokenizer_info).
  request_timeout_s: 300
  tokenize_timeout_s: 30

determinism:
  # Dispatches per configuration. A replay needs at least two.
  runs: 2
