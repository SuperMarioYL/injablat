[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "injablat"
version = "0.1.0"
description = "Ablate the context injected by a harness and re-run the claim to see which spans it actually needs."
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "SuperMarioYL" }]
keywords = [
  "ablation",
  "attribution",
  "llm",
  "model-evaluation",
  "reproducibility",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "httpx>=0.27,<0.28",
  "pydantic>=2.7,<3",
  "typer>=0.12,<0.13",
  "pyyaml>=6.0,<7",
  "jinja2>=3.1,<4",
  "rich>=13.7,<14",
]

[project.optional-dependencies]
dev = ["pytest>=8.2,<9"]

[project.scripts]
injablat = "injablat.cli:main"

[project.urls]
Homepage = "https://github.com/SuperMarioYL/injablat"
Repository = "https://github.com/SuperMarioYL/injablat"
Issues = "https://github.com/SuperMarioYL/injablat/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/injablat"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/configs",
  "/LICENSE",
  "/README.md",
]
