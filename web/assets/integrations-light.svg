<text x="36" y="44" font-size="14" font-weight="700" letter-spacing="3" fill="#557188">CAPABILITIES · INTEGRATION</text>
<text x="964" y="44" font-size="12.5" text-anchor="end" fill="#557188">v0.1 commands, two backend routes, undelivered roadmap</text>
<rect x="40" y="70" width="570" height="372" rx="14" class="panel"/>
<text x="62" y="100" font-size="11.5" font-weight="700" letter-spacing="2" fill="#557188">v0.1 COMMANDS</text>
<rect x="60" y="112" width="530" height="42" rx="9" class="chip"/>
<text x="76" y="139" font-size="13" font-weight="600" class="mono" fill="#3a799b">injablat validate</text>
<text x="320" y="139" font-size="11.5" class="mono" fill="#557188">schema · template · span tokens</text>
<rect x="60" y="168" width="530" height="42" rx="9" class="chip"/>
<text x="76" y="195" font-size="13" font-weight="600" class="mono" fill="#3a799b">injablat replay</text>
<text x="320" y="195" font-size="11.5" class="mono" fill="#557188">manifest · determinism gate</text>
<rect x="60" y="224" width="530" height="42" rx="9" class="chip"/>
<text x="76" y="251" font-size="13" font-weight="600" class="mono" fill="#3a799b">injablat ablate</text>
<text x="320" y="251" font-size="11.5" class="mono" fill="#557188">deletion sweep · minimal set</text>
<rect x="60" y="280" width="530" height="42" rx="9" class="chip"/>
<text x="76" y="307" font-size="13" font-weight="600" class="mono" fill="#3a799b">injablat report</text>
<text x="320" y="307" font-size="11.5" class="mono" fill="#557188">report.md / .html / .json</text>
<rect x="60" y="336" width="530" height="42" rx="9" class="chip"/>
<text x="76" y="363" font-size="13" font-weight="600" class="mono" fill="#3a799b">injablat verify</text>
<text x="320" y="363" font-size="11.5" class="mono" fill="#557188">MATCH / DRIFT per row</text>
<text x="62" y="424" font-size="11" class="mono" fill="#557188">python 3.12 · source install (not on PyPI yet) · MIT</text>
<rect x="632" y="70" width="328" height="184" rx="14" class="panel"/>
<text x="654" y="100" font-size="11.5" font-weight="700" letter-spacing="2" fill="#557188">BACKEND ROUTES</text>
<text x="654" y="132" font-size="15" font-weight="700" class="mono" fill="#3a799b">vLLM</text>
<text x="654" y="154" font-size="10.5" class="mono" fill="#557188">/v1/chat/completions · continue_final_message</text>
<text x="654" y="172" font-size="10.5" class="mono" fill="#132330">replay + deletion + prefill ablation</text>
<text x="654" y="210" font-size="15" font-weight="700" class="mono" fill="#5e6acd">llama.cpp</text>
<text x="654" y="232" font-size="10.5" class="mono" fill="#557188">/v1/chat/completions · /tokenize · /props</text>
<text x="654" y="250" font-size="10.5" class="mono" fill="#132330">replay + non-prefill deletion only</text>
<rect x="632" y="266" width="328" height="192" rx="14" class="key"/>
<text x="654" y="294" font-size="11.5" font-weight="700" letter-spacing="2" fill="#3a799b">ROADMAP · NOT DELIVERED</text>
<text x="654" y="322" font-size="11" class="mono" fill="#557188">› llama.cpp prefill ablation</text>
<text x="654" y="345" font-size="11" class="mono" fill="#557188">› trace → span JSONL importer</text>
<text x="654" y="368" font-size="11" class="mono" fill="#557188">› batch matrices across claims</text>
<text x="654" y="391" font-size="11" class="mono" fill="#557188">› repeated sampling · significance</text>
<text x="654" y="414" font-size="11" class="mono" fill="#557188">› card signing · archiving</text>
<text x="654" y="440" font-size="10.5" fill="#5e6acd">team edition = roadmap, not a product</text>
<rect x="40" y="470" width="920" height="62" rx="12" class="panel"/>
<text x="62" y="496" font-size="11" font-weight="700" letter-spacing="2" fill="#557188">OUT OF SCOPE IN v0.1</text>
<text x="62" y="518" font-size="11" class="mono" fill="#557188">no web panel · no server · no multi-user · no queue · no LLM referee · no rewriting or token perturbation</text>
