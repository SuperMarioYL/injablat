<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="architecture-light-title architecture-light-desc" data-palette="56b4e6-6a78e7-acf6f5-8f471153f78a">
<title id="architecture-light-title">injablat architecture (light)</title><desc id="architecture-light-desc">The pipeline from claim through validate, replay manifest, ablate sweep to report and verify, with recorded artifacts.</desc>
<defs>
<linearGradient id="architecture-light-neon" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1000" y2="560"><stop stop-color="#3a799b"/><stop offset=".55" stop-color="#5e6acd"/><stop offset="1" stop-color="#557979"/></linearGradient>
<radialGradient id="architecture-light-haze"><stop stop-color="#3a799b" stop-opacity=".16"/><stop offset="1" stop-color="#f9fcfe" stop-opacity="0"/></radialGradient>
<filter id="architecture-light-glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<marker id="architecture-light-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="m1 1 7 4-7 4" fill="none" stroke="#5e6acd" stroke-width="1.5"/></marker>
</defs><style>
text{font-family:-apple-system, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;fill:#132330}
.mono{font-family:'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace}
.muted{fill:#557188}
.neon{fill:url(#architecture-light-neon)}
.panel{fill:#f7fbfe;stroke:#cbe8f7;stroke-width:1}
.key{fill:#f7fbfe;stroke:#3a799b;stroke-width:1.2}
.chip{fill:#f3fafd;stroke:#cbe8f7;stroke-width:1}
.wire{fill:none;stroke:#cbe8f7;stroke-width:1.2}
.flow{fill:none;stroke:#3a799b;stroke-width:2}
.ok{fill:#3a799b}
.dim{fill:#557188}
.flow{stroke-dasharray:8 14;animation:fl 2.4s linear infinite}.pulse{animation:pl 3s ease-in-out infinite}.breathe{animation:br 4s ease-in-out infinite}@keyframes fl{to{stroke-dashoffset:-44}}@keyframes pl{0%,100%{opacity:.5}50%{opacity:1}}@keyframes br{0%,100%{opacity:.35}50%{opacity:.85}}@media (prefers-reduced-motion:reduce){.flow,.pulse,.breathe{animation:none!important}}
</style>
