<rect x="160" y="44.800000000000004" width="680" height="470.4" fill="url(#architecture-light-haze)"/>
<text x="36" y="44" font-size="14" font-weight="700" letter-spacing="3" fill="#557188">ARCHITECTURE</text>
<text x="964" y="44" font-size="12.5" text-anchor="end" fill="#557188">one claim · one pinned stack · one recorded card</text>
<rect x="44" y="78" width="640" height="66" rx="12" class="panel"/>
<text x="64" y="106" font-size="11" class="mono" fill="#557188">01</text>
<text x="96" y="107" font-size="16" font-weight="700" class="mono" fill="#132330">claim.yaml</text>
<text x="96" y="127" font-size="12" class="mono" fill="#557188">model · endpoint · backend</text>
<text x="430" y="127" font-size="12" class="mono" fill="#557188">template · spans · detector · seed</text>
<line x1="364" y1="144" x2="364" y2="162" class="wire flow" marker-end="url(#architecture-light-arrow)"/>
<rect x="44" y="162" width="640" height="66" rx="12" class="panel"/>
<text x="64" y="190" font-size="11" class="mono" fill="#557188">02</text>
<text x="96" y="191" font-size="16" font-weight="700" class="mono" fill="#132330">validate</text>
<text x="96" y="211" font-size="12" class="mono" fill="#557188">schema · template hash · /tokenize</text>
<text x="430" y="211" font-size="12" class="mono" fill="#557188">5 spans → 2,902 prompt tokens</text>
<line x1="364" y1="228" x2="364" y2="246" class="wire flow" marker-end="url(#architecture-light-arrow)"/>
<rect x="44" y="246" width="640" height="66" rx="12" class="panel"/>
<text x="64" y="274" font-size="11" class="mono" fill="#557188">03</text>
<text x="96" y="275" font-size="16" font-weight="700" class="mono" fill="#132330">replay</text>
<text x="96" y="295" font-size="12" class="mono" fill="#557188">2 runs per configuration</text>
<text x="430" y="295" font-size="12" class="mono" fill="#557188">manifest 8c5885… · determinism gate</text>
<line x1="364" y1="312" x2="364" y2="330" class="wire flow" marker-end="url(#architecture-light-arrow)"/>
<rect x="44" y="330" width="640" height="66" rx="12" class="key"/>
<text x="64" y="358" font-size="11" class="mono" fill="#557188">04</text>
<text x="96" y="359" font-size="16" font-weight="700" class="mono" fill="#3a799b">ablate</text>
<text x="96" y="379" font-size="12" class="mono" fill="#557188">delete spans · prefill ladder 0→2,232</text>
<text x="430" y="379" font-size="12" class="mono" fill="#557188">greedy minimal sufficient set</text>
<line x1="364" y1="396" x2="364" y2="414" class="wire flow" marker-end="url(#architecture-light-arrow)"/>
<rect x="44" y="414" width="640" height="66" rx="12" class="panel"/>
<text x="64" y="442" font-size="11" class="mono" fill="#557188">05</text>
<text x="96" y="443" font-size="16" font-weight="700" class="mono" fill="#132330">report / verify</text>
<text x="96" y="463" font-size="12" class="mono" fill="#557188">report.md · report.html · report.json</text>
<text x="430" y="463" font-size="12" class="mono" fill="#557188">verify: MATCH 10 of 10 rows</text>
<rect x="712" y="78" width="248" height="414" rx="14" class="panel"/>
<text x="732" y="108" font-size="11.5" font-weight="700" letter-spacing="2" fill="#557188">RECORDED ARTIFACTS</text>
<path d="M 732 120 H 940" stroke="#cbe8f7" stroke-width="1"/>
<circle cx="740" cy="148" r="3.5" fill="#557188"/>
<text x="754" y="152" font-size="11.5" class="mono" fill="#132330">claim.yaml</text>
<circle cx="740" cy="192" r="3.5" fill="#557188"/>
<text x="754" y="196" font-size="11.5" class="mono" fill="#132330">runs/&lt;config&gt;.runN.json</text>
<circle cx="740" cy="236" r="3.5" fill="#557188"/>
<text x="754" y="240" font-size="11.5" class="mono" fill="#132330">manifest.json</text>
<circle cx="740" cy="280" r="3.5" fill="#3a799b"/>
<text x="754" y="284" font-size="11.5" class="mono" fill="#132330">ablation.json</text>
<circle cx="740" cy="324" r="3.5" fill="#557188"/>
<text x="754" y="328" font-size="11.5" class="mono" fill="#132330">report.md / .json</text>
<text x="732" y="410" font-size="10.5" fill="#557188">prompt token ids come only</text>
<text x="732" y="428" font-size="10.5" fill="#557188">from the backend /tokenize.</text>
<text x="732" y="458" font-size="10.5" class="mono" fill="#557188">No re-derivation in report</text>
<text x="732" y="476" font-size="10.5" fill="#557188">or verify.</text>
</svg>
