name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Smoke import
        run: python -c "import injablat"

      - name: Test
        run: |
          status=0
          python -m pytest -q || status=$?
          # exit code 5 means no tests were collected, which is not a failure
          if [ "$status" -eq 5 ]; then
            exit 0
          fi
          exit "$status"
