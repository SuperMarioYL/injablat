# A claim reproduced from the published Flash Next prefill dispute.
#
# The published claim: Qwen 3.8 Flash Next completes partial cURL commands.
# The disputed run prefilled 2,232 tokens immediately before the URL, so the
# question this claim asks is whether the command still appears once that
# assistant prefix is removed. Reproduction alone does not answer it.

id: qwen-prefill-curl

description: >-
  The released trace ends with a 2,232-token assistant prefix that stops at the
  first character of the URL. The claim on the table is that the model completes
  partial cURL commands; the claim under test is whether the injected prefix is
  what makes it do so.

model:
  name: qwen3-8b-instruct
  endpoint: http://127.0.0.1:8000
  backend: vllm
  revision: qwen3-8b-instruct-2026-10-14
  # Pinned from the stack the trace was recorded on. When your endpoint serves a
  # different template this check fails on purpose: a different template is a
  # different prompt, and the replay would no longer be the disputed run.
  chat_template_sha: af9cd64e61dc43a997c936f2d7b30f51223c7c0b7480a3f1b1ca0112375770d9
  # Optional: ship the exact template body with the claim instead of reading it
  # from the endpoint.
  # chat_template_path: templates/qwen3-chatml.jinja

spans_file: spans.jsonl

detector:
  kind: regex
  # The behaviour, not the transcript: a shell command that fetches an https URL.
  expect: "curl -sS 'https://[^']+'"

sampling:
  temperature: 0.0
  top_p: 1.0
  seed: 0
  max_tokens: 512
